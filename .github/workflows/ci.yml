# Runs the quality gate (CLAUDE.md section 4) on every push to main and on
# every pull request: generated code up to date → format → analyze → test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Flutter version used locally (`flutter --version`).
  FLUTTER_VERSION: 3.44.8

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Enable in step 1.2, when build_runner is added to the project.
      # - name: Generate code
      #   run: dart run build_runner build --delete-conflicting-outputs

      # Generated files are committed (CLAUDE.md section 4). If regenerating
      # changed anything, someone forgot to commit the generated output.
      - name: Check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::Generated code is out of date. Run the generators locally and commit the result."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
