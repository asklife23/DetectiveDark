# Code generation settings (`dart run build_runner build`).
targets:
  $default:
    builders:
      json_serializable:
        # Only DTOs are generated: they live in the data layer of a feature.
        generate_for:
          - lib/features/**/data/models/**.dart
        options:
          # A wrong type reports the key it happened at instead of a bare
          # cast error.
          checked: true
          # A misspelled field name in content JSON is an error, not a
          # silently ignored key.
          disallow_unrecognized_keys: true
          # Content is only read, never written back.
          create_to_json: false
      drift_dev:
        # Only the local database is generated; scanning fewer files keeps
        # the build fast.
        generate_for:
          - lib/features/**/data/datasources/local/**.dart
        options:
          # Used by `dart run drift_dev make-migrations`: it dumps the schema
          # of every listed database to `drift_schemas/` and generates the
          # migration tests under `test/drift/`.
          databases:
            app_database: lib/features/progress/data/datasources/local/app_database.dart
