# Strict lint rules from Very Good Ventures. The version is pinned by
# `very_good_analysis` in pubspec.yaml.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated code (Drift, l10n, ...) is not hand-written; do not lint it.
    - "**/*.g.dart"
    - lib/core/l10n/generated/**
    - build/**

linter:
  rules:
    # This is an app, not a published package: documenting every public
    # member would add noise without helping readers.
    public_member_api_docs: false
    # Repository interfaces and small services are abstractions on purpose
    # (Clean Architecture, test doubles), even when they have one method.
    one_member_abstracts: false
