name: detective_dark
description: "A noir 2.5D point-and-click detective game built with Flutter."
publish_to: 'none'

# <version name>+<build number>. The build number becomes Android
# versionCode / iOS CFBundleVersion and must grow with every store upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  # Pinned to the version of `drift_dev`: its command line tool
  # (`make-migrations`) does not compile against a newer drift. Raise both
  # together (plan.md, notes of step 2.1).
  drift: 2.34.0
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  # The version is pinned by flutter_localizations.
  intl: any
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  # Regenerates localizations from l10n.yaml on `flutter run` / `build`.
  generate: true
  uses-material-design: true

  assets:
    # Font license texts, shown on the app's license page.
    - assets/fonts/courier_prime/OFL.txt
    - assets/fonts/ibm_plex_sans/OFL.txt
    # Game content (scenes, items, notes, texts). A folder entry covers only
    # the files directly inside it, so EVERY folder that holds content files
    # is listed (also `scenes/` when a chapter splits its scenes into several
    # files). The content validation test fails when one is missing: content
    # files are found through the asset manifest, so a forgotten folder would
    # silently be empty.
    - assets/content/common/
    - assets/content/cases/case01/
    - assets/content/cases/case01/chapters/ch01/
    # Developer menu presets (named game states). Bundled ONLY in the `dev`
    # flavor: staging and prod packages do not contain the file. Windows has
    # no flavors, so it is never bundled there; the menu then shows an empty
    # preset list.
    - path: assets/dev/
      flavors:
        - dev

  # Fonts are bundled (no runtime download): the game must work offline.
  # Both cover Latin Extended, so new languages need no new fonts.
  fonts:
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/courier_prime/CourierPrime-Regular.ttf
        - asset: assets/fonts/courier_prime/CourierPrime-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Bold.ttf
          weight: 700
