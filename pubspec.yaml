name: detective_dark
description: "A noir 2.5D point-and-click detective game built with Flutter."
publish_to: 'none'

# <version name>+<build number>. The build number becomes Android
# versionCode / iOS CFBundleVersion and must grow with every store upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  # The version is pinned by flutter_localizations.
  intl: any

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  # Regenerates localizations from l10n.yaml on `flutter run` / `build`.
  generate: true
  uses-material-design: true

  # Font license texts, shown on the app's license page.
  assets:
    - assets/fonts/courier_prime/OFL.txt
    - assets/fonts/ibm_plex_sans/OFL.txt

  # Fonts are bundled (no runtime download): the game must work offline.
  # Both cover Latin Extended, so new languages need no new fonts.
  fonts:
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/courier_prime/CourierPrime-Regular.ttf
        - asset: assets/fonts/courier_prime/CourierPrime-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Bold.ttf
          weight: 700
